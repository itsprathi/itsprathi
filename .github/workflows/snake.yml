name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v5

      - name: Generate snake contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: itsprathi
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=#8B5CF6
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#00E5FF

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No snake changes."
            exit 0
          fi
          git commit -m "chore: refresh contribution snake"
          git push

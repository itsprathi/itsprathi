<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="j" x1="0" x2="1"><stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF5CF4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="150" rx="20" fill="#070A12" stroke="#1F2A44"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="34" font-weight="700" fill="url(#j)" filter="url(#glow)">コード • ゲーム • 音楽 • 桜</text>
    <text x="600" y="106" font-size="18" fill="#A7B0C0">Tokyo nights / terminal glow / pixel dreams</text>
  </g>
  <g fill="#FF7ACB" opacity=".8">
    <circle cx="88" cy="40" r="3"><animate attributeName="cy" values="40;118;40" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="90" r="4"><animate attributeName="cy" values="90;30;90" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="66" r="3"><animate attributeName="cy" values="66;118;66" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="95" r="4"><animate attributeName="cy" values="95;34;95" dur="5.4s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="40" y="128" width="1120" height="2" fill="url(#j)">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>